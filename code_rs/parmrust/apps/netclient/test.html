<H3><A NAME="logtext">Logical Text Markup</A></H3>

<P><EM>Emphasized</EM>, <STRONG>Strong</STRONG>, <DFN>Definition</DFN>,
    <CODE>Code</CODE>, <SAMP>Sample</SAMP>, <KBD>Keyboard</KBD>,
    <VAR>Variable</VAR>, <CITE>Citation</CITE></P>

<P><Q>Quote</Q>, <ABBR>Abbreviation</ABBR>, <ACRONYM>Acronym</ACRONYM>,
    <DEL>Deleted</DEL>, <INS>Inserted</INS>&nbsp; &nbsp; (<BIG><FONT COLOR="#FF0000">*</FONT></BIG>HTML 4.0)</P>


<HR>

<H3><A NAME="phystext">Physical Text Markup</A></H3>

<P><I>Italics</I>, <B>Bold</B>, <U>Underlined</U>, <TT>Teletype</TT>,
    <BIG>Big</BIG>, <SMALL>Small</SMALL>, <STRIKE>Strike</STRIKE>,
    <SUB>Subscript</SUB>, <SUP>Superscript</SUP>,
    <BLINK>Blinking</BLINK><BIG><FONT COLOR="#FF0000">*</FONT></BIG></P>
